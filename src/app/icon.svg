<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Icon Neon Glow Gradient -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box with Rounded Corner -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" stroke="#1E293B" stroke-width="8"/>

  <!-- Main <K/> Emblem -->
  <g filter="url(#glow)">
    <!-- Left Bracket < / Vertical Stem of K -->
    <path 
      d="M 180 140 L 120 256 L 180 372" 
      fill="none" 
      stroke="url(#brandGradient)" 
      stroke-width="48" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Diagonal Arms forming the right part of K & > -->
    <path 
      d="M 360 140 L 250 256 L 360 372" 
      fill="none" 
      stroke="url(#brandGradient)" 
      stroke-width="48" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Middle Connector line uniting < and > into K -->
    <line 
      x1="120" 
      y1="256" 
      x2="250" 
      y2="256" 
      stroke="url(#brandGradient)" 
      stroke-width="44" 
      stroke-linecap="round"
    />
  </g>
</svg>
